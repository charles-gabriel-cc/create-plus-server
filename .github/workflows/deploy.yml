name: Deploy to EnxadaHost Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Sync Packwiz metadata and export .mrpack
        run: python scripts/sync_packwiz.py --export-mrpack Create+.mrpack

      - name: Sync mods, resourcepacks, shaderpacks, datapacks and config to EnxadaHost
        env:
          ENXADA_API_KEY: ${{ secrets.ENXADA_API_KEY }}
          ENXADA_SERVER_ID: "b31b9e05"
        run: python scripts/deploy_enxadahost.py

      - name: Upload Create+.mrpack workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Create+.mrpack
          path: Create+.mrpack

      - name: Publish Create+.mrpack to latest GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest Create+.mrpack --clobber
          else
            gh release create latest Create+.mrpack --title "Create+ Modpack (Latest)" --notes "Arquivo .mrpack gerado automaticamente via Packwiz."
          fi
