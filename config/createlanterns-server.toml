			# Range: 0 ~ 200
			windUp = 6
			#How strong it is, compared to the default (1). Bloom: how far life springs up around its bearer (1 is 8 blocks).
			# Default: 1.0
			# Range: 0.0 ~ 100.0
			strength = 1.0

		#Its fourth power on the power key, Shoulder Laser.
		[lights.white.shoulder_laser]
			#If true, the power works on its key.
			enabled = true
			#Energy it costs. A stronger bearer pays less.
			# Default: 20.0
			# Range: 0.0 ~ 100000.0
			cost = 20.0
			#How many ticks before it can be used again (20 a second).
			# Default: 40
			# Range: 0 ~ 72000
			cooldown = 40
			#How many ticks its light builds up in the bearer's hand before it's let go. On a
			#server, players already in the world see a change to this straight away.
			# Default: 4
			# Range: 0 ~ 200
			windUp = 4
			#How strong it is, compared to the default (1). Shoulder Laser: how hard its beam hits and how fast it melts (1 is 4 damage every half second).
			# Default: 1.0
			# Range: 0.0 ~ 100.0
			strength = 1.0

		#Its fifth power on the power key, The Brightest Day. It's the light's ultimate.
		[lights.white.day]
			#If true, the ultimate works on its key (while powers.ultimates is on).
			enabled = true
			#Energy it costs. A stronger bearer pays less.
			# Default: 400.0
			# Range: 0.0 ~ 100000.0
			cost = 400.0
			#How many ticks before it can be used again (20 a second).
			# Default: 6000
			# Range: 0 ~ 72000
			cooldown = 6000
			#How many ticks its light builds up in the bearer's hand before it's let go. On a
			#server, players already in the world see a change to this straight away.
			# Default: 40
			# Range: 0 ~ 200
			windUp = 40
			#How strong it is, compared to the default (1). The Brightest Day: how much it heals, and how hard it burns the dead (1 is 2 a second, and 12 straight away).
			# Default: 1.0
			# Range: 0.0 ~ 100.0
			strength = 1.0

#How the lights affect each other. Two rings worn together, and the lit rings of bearers near each other,
#strengthen or weaken each other's light (hope feeds will, hope calms rage, opposites dim each other, death and life
#most of all). A weakened ring's abilities, grip and constructs get weaker, and its charge drains faster.
#A strengthened one's the other way round.
[potency]
	#If true, two rings worn together affect each other. Blue and green strengthen each
	#other, and opposites clash and both get weaker. If false, they don't.
	wornTogether = true
	#How strongly two rings worn together affect each other,
	#compared to the default (1 makes blue and green each a quarter stronger, opposites each a quarter weaker, black and white
	#each by half).
	# Default: 1.0
	# Range: 0.0 ~ 4.0
	wornTogetherStrength = 1.0
	#If true, the lit rings of bearers near each other affect each other. A blue ring nearby weakens
	#a red or yellow one and strengthens a green one. Opposites weaken each other, black and white the most.
	#If false, they don't.
	nearby = true
	#How strongly another bearer's lit ring nearby affects a bearer's,
	#compared to the default (1 is as much as worn together, while they're within a quarter of the radius).
	# Default: 1.0
	# Range: 0.0 ~ 4.0
	nearbyStrength = 1.0
	#How close (blocks) another bearer's lit ring has to be to affect a bearer's. It's full strength within a
	#quarter of that, then it fades out to nothing at the edge.
	# Default: 16.0
	# Range: 0.0 ~ 128.0
	radius = 16.0

#What a ring can do to other players. Each switch only applies where the server lets players hurt each other at all (its pvp setting, and teams).
[pvp]
	#If true, the lights' powers can hurt and hinder other players: a plasma bolt, drain, fear
	#shaking their hard light. If false, powers don't affect players.
	powers = true
	#If true, a ring can grab another player, and what it holds or throws can hurt them. If false,
	#it can't do either (and drops any player it's holding now).
	grip = true
	#If true, a bearer's constructs can hurt other players by running into them and burning them in
	#their fires. If false, someone else's hard light never hurts a player.
	constructs = true
	#If true, a crash's blast hurts other players nearby, and a hero landing throws them back. If
	#false, neither one affects other players.
	flight = true

#What the mod can do to the world's blocks.
[griefing]
	#If true, the mod changes the world's blocks where its story needs to. That's crash craters and
	#(in an edition with them) the wrecks of ships that come down. If false, it doesn't change anything. No crater gets dug and no
	#ship comes down.
	worldChanges = true
	#If true, the mod only changes the world's blocks (craters, wrecks, a laser's
	#melting) while the game rule mobGriefing is on. If false, it ignores the rule, same as it always has.
	followMobGriefing = false

#Dimensions where rings, flight and constructs don't work. Each entry's an id
#(minecraft:the_nether), or every dimension of a mod (twilightforest:*).
[dimensions]
	#Dimensions where rings can't light up. A lit one goes dark there (so nothing else about it works there either).
	noRings = []
	#Dimensions where rings can't fly. Anyone flying there drops.
	noFlight = []
	#Dimensions where constructs can't be designed, copied or summoned. Any that are out there disappear.
	noConstructs = []

#The land ahead of a fast flier, flying on the ring or riding a construct. It gets made and loaded before they
#reach it, so it's there when they arrive.
[landAhead]
	#If true, the land in the path of a bearer flying fast, or riding a construct fast, gets made and loaded
	#before they reach it, as far ahead as seconds says, nearest first (with Distant Horizons on the server, its far terrain gets
	#built ahead of them first). If false, the land loads like it does for anyone, around them as they go, a
	#few chunks at a time.
	enabled = true
	#How far ahead the land gets made, in seconds of flight at the fastest they went over the last that many
	#seconds (so someone held back at the edge of the land still gets land made as fast as they flew). At 300 blocks a
	#second, 4 is 1200 blocks ahead. At 18 (a construct ridden flat out, by default) it's 72.
	# Default: 4.0
	# Range: 0.5 ~ 30.0
	seconds = 4.0
	#The most chunks requested ahead in one server tick, for all fliers together.
	# Default: 8
	# Range: 1 ~ 256
	chunksPerTick = 8
	#The most chunks kept loaded along one flier's path at once (each with the
	#chunks around it fully made). At 1000 blocks a second, 128 is about two seconds of flight.
	# Default: 128
	# Range: 1 ~ 4096
	chunksPerFlier = 128
	#The most chunks kept loaded along the paths of all fliers together.
	# Default: 512
	# Range: 1 ~ 65536
	mostChunks = 512

#A light's dust. Cooking a bucket of its liquid light in a furnace or a smoker makes it (Willpower Dust, Fear Dust
#and so on). Taking it heightens that light for a while.
[dust]
	#If true, the dust is snorted instead of eaten. It's held up to the face and sniffed, with no crunching.
	#It does the same either way.
	snortIt = false
	#How many seconds a dust's light stays heightened (180 is 3 minutes).
	# Default: 180
	# Range: 1 ~ 3600
	seconds = 180
	#How many times as much its light's deed points count while it's heightened (2 is twice). Willpower
	#grows that much faster too, while a ring of that light is worn.
	# Default: 2.0
	# Range: 1.0 ~ 10.0
	times = 2.0

#Weapons that Create's rotation drives. A weapon is a Weapon Mount, a Weapon Cog in front of it and a weapon in front
#of that, all facing the same way. It needs rotation, a redstone signal and ammunition.
[weapons]
	#If true, weapons work. If false, their parts never lock together and nothing fires.
	enabled = true
	#If true, a weapon hurts players like anything else in its way. If false, players take no harm from
	#weapons.
	hurtPlayers = true

	#The Laser Rifle. Each shot burns a Laser Cell from its Weapon Mount.
	[weapons.laser]
		#How fast the Weapon Cog has to turn for the laser to work, in RPM. Turning
		#faster overcharges each shot.
		# Default: 32
		# Range: 1 ~ 256
		minimumSpeed = 32
		#The load a laser puts on its Weapon Cog, in su for each RPM. The load is there whenever the
		#weapon is locked together, firing or not.
		# Default: 8.0
		# Range: 0.0 ~ 1024.0
		stress = 8.0
		#How long the laser charges before it fires, in ticks (20 is a second).
		# Default: 64
		# Range: 0 ~ 1200
		chargeTicks = 64
		#How many times over the laser can charge. Each tick of charging adds the
		#cog's speed over minimumSpeed, so at the minimum a shot is charged once and at four times it is charged four times.
		#A shot charged more is stronger. It heats blocks that many times as fast, is wider and hits much harder.
		# Default: 4.0
		# Range: 1.0 ~ 8.0
		overchargeLimit = 4.0
		#If true, the laser keeps firing for as long as it has its signal, its rotation and Laser Cells.
		#It burns shotCost again for each shotTicks of beam. If false, each shot lasts shotTicks. Then it rests for restTicks and,
		#with the signal still on, charges the next.
		keepFiring = true
		#How long the laser rests after it stops firing before it can charge again, in ticks.
		# Default: 40
		# Range: 0 ~ 1200
		restTicks = 40
		#How far the beam reaches, in blocks. It stops sooner at land that isn't loaded, since it never
		#loads land, and 512 blocks past the top or the bottom of the world. At 30000000 it has no limit of its own.
		# Default: 4096.0
		# Range: 1.0 ~ 3.0E7
		reach = 4096.0
		#The harm of each hit of the beam on a shot charged once (2 is a heart). A shot charged twice
		#hurts four times as much, and one charged four times hurts sixteen times as much.
		# Default: 8.0
		# Range: 0.0 ~ 1000.0
		hitDamage = 8.0
		#How often the beam hits what stands in it, in ticks.
		# Default: 10
		# Range: 1 ~ 200
		hitTicks = 10
		#How far around the spot the beam hits it also melts blocks, in blocks, on a shot
		#charged once. This starts when the beam stays on one block for more than a tick. It grows by half of that for each extra
		#charge. The blast hurts what stands up to a block further out. At 0 it melts only what the beam touches.
		# Default: 1.25
		# Range: 0.0 ~ 3.5
		blastRadius = 1.25
		#If true, the beam melts every block it touches. It never melts what can't be broken, and it
		#obeys griefing.worldChanges and griefing.followMobGriefing. If false, it only hurts.
		breakBlocks = true
		#How fast the beam melts blocks. At 1 stone melts in a tenth of a second on a beam
		#charged once, and obsidian in about two seconds. A beam charged more melts that many times as fast. Every block that
		#can be broken melts in the end.
		# Default: 1.0
		# Range: 0.0 ~ 100.0
		meltSpeed = 1.0
		#The charge each shot burns. A beam that keeps firing burns it again for each shotTicks.
		#A Laser Cell holds 100. A full mount of anything that feeds the laser always pays for one shot, even when the shot costs
		#more than it holds.
		# Default: 100.0
		# Range: 0.0 ~ 100000.0
		shotCost = 100.0
		#What each item's charge is multiplied by. 1 leaves a Laser Cell at 100.
		# Default: 1.0
		# Range: 0.0 ~ 100.0
		chargeWorth = 1.0
		#How long one shot of beam lasts, in ticks. While the laser keeps firing, it burns shotCost
		#again each time this passes.
		# Default: 20
		# Range: 1 ~ 1200
		shotTicks = 20
		#If true, laser beams that meet combine into one bigger beam. It leaves from where they meet,
		#aimed between them, and stronger beams pull it their way. It is as wide as all of them together, up to combinedWidthLimit,
		#and hits as hard as all of them together. Equal beams that meet head on stop each other and burn where they meet. When
		#one side has more beams, or the same number charged more, it overpowers the other. It stops the weaker beams and runs on.
		#If false, beams pass through each other.
		combineBeams = true
		#The widest a combined beam can get, in blocks. A combined beam is
		#as wide as all of its beams together, up to this. It is never narrower than its widest beam.
		# Default: 16.0
		# Range: 1.0 ~ 64.0
		combinedWidthLimit = 16.0
		#How long a laser's beam has to be overpowered head on without a break before the
		#laser is beaten, in ticks (20 is a second). A beaten Laser Rifle melts away, the way its beam melts any block, so
		#breakBlocks, griefing and claims hold. Where they keep it whole, it is switched off instead until its signal is cut and
		#given again. Its Weapon Cog and Weapon Mount stay. A beaten Shoulder Laser is sent away, and its bearer waits
		#powers.shoulderLaser.overpoweredTicks to summon it again.
		# Default: 20
		# Range: 0 ~ 1200
		overpowerTicks = 20
