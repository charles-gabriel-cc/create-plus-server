#LuaJ character dimensions; terminal.attach() or term.attach() still controls visibility.
#Sizes are bounded to 160 columns, 80 rows and 8192 cells.
[lua]
	#Default terminal columns for new LuaJ instances. CC:Tweaked defaults to 51.
	# Default: 51
	# Range: 1 ~ 160
	terminalWidth = 51
	#Default terminal rows for new LuaJ instances. CC:Tweaked defaults to 19.
	# Default: 19
	# Range: 1 ~ 80
	terminalHeight = 19
	#Override LuaJ monitor columns at text scale 1. Zero uses the host's normal CC:Tweaked display sizing.
	# Default: 0
	# Range: 0 ~ 160
	monitorWidth = 0
	#Override LuaJ monitor rows at text scale 1. Zero uses the host's normal CC:Tweaked display sizing.
	# Default: 0
	# Range: 0 ~ 80
	monitorHeight = 0
